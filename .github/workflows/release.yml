name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: plugin-windows-x64
            package_suffix: win-x64
          - name: macOS ARM64
            os: macos-14
            target: aarch64-apple-darwin
            artifact: plugin-macos-arm64
            package_suffix: mac-arm64
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}

      - name: Read plugin version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -LiteralPath 'manifest.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $package = Get-Content -LiteralPath 'package.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($manifest.version -ne $package.version) {
              throw "Version mismatch: manifest=$($manifest.version), package=$($package.version)"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$($manifest.version)") {
              throw "Tag $env:GITHUB_REF_NAME does not match plugin version v$($manifest.version)"
          }
          "value=$($manifest.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          bun install --frozen-lockfile --ignore-scripts

      - name: Build plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          bun run build

      - name: Validate macOS binary
        if: matrix.target == 'aarch64-apple-darwin'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $worker = 'dist/bin/mac-arm64/ai-worker'
          $architectures = (& lipo -archs $worker).Trim()
          if ($architectures -notmatch '(^|\s)arm64($|\s)') {
              throw "Expected an arm64 worker, got: $architectures"
          }
          $links = (& otool -L $worker) -join "`n"
          if ($links -notmatch 'CoreML\.framework') {
              throw 'The macOS worker is not linked with CoreML.framework'
          }

      - name: Package plugin
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $packageName = 'auto-tagger-eagle-plugin-v${{ steps.version.outputs.value }}-${{ matrix.package_suffix }}.eagleplugin'
          $package = Join-Path $PWD $packageName
          if (Test-Path -LiteralPath $package) {
              Remove-Item -LiteralPath $package -Force
          }
          if ($env:RUNNER_OS -eq 'Windows') {
              7z a -tzip -mx=9 $package '.\dist\*'
          } else {
              Push-Location -LiteralPath 'dist'
              try {
                  zip -9 -r $package .
              } finally {
                  Pop-Location
              }
          }
          "path=$packageName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}-v${{ steps.version.outputs.value }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Upload release packages
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.eagleplugin
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
